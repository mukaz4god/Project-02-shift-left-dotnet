name: OWASP ZAP DAST

on:
  workflow_dispatch:

jobs:
  zap-scan:

    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://${{ secrets.STAGING_HOST }}:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_xml.xml
            report_md.md


