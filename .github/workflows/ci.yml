name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  sast-scan:
    uses: ./.github/workflows/sast.yml

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml

  codeQL-scan-analysis:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      security-events: write
      contents: read

  dependency-check:
    uses: ./.github/workflows/dependency-check.yml

  image-scan:
    uses: ./.github/workflows/image-scan.yml
    permissions:
      contents: read
      security-events: write

  sbom:
    uses: ./.github/workflows/sbom.yml

  defectdojo-import:
    runs-on: ubuntu-latest
    needs:
      - sast-scan
      - dependency-check
      - image-scan
    if: always()

    steps:
      - name: Download Semgrep artifact
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results
        continue-on-error: true

      - name: Download Dependency-Check artifact
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report
        continue-on-error: true

      - name: Download Trivy artifact
        uses: actions/download-artifact@v4
        with:
          name: trivy-results
          path: trivy-results
        continue-on-error: true

      - name: Debug downloaded files
        run: find . -type f

      - name: Import Semgrep into DefectDojo
        if: hashFiles('semgrep-results/semgrep-results.json') != ''
        run: |
          curl -i -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "file=@semgrep-results/semgrep-results.json" \
            -F "active=true" \
            -F "verified=true"

      - name: Import Dependency-Check into DefectDojo
        if: hashFiles('dependency-check-report/dependency-check-report.json') != ''
        run: |
          curl -i -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "scan_type=Dependency Check Scan" \
            -F "file=@dependency-check-report/dependency-check-report.json" \
            -F "active=true" \
            -F "verified=true"

      - name: Import Trivy into DefectDojo
        if: hashFiles('trivy-results/trivy-results.json') != ''
        run: |
          curl -i -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "scan_type=Trivy Scan" \
            -F "file=@trivy-results/trivy-results.json" \
            -F "active=true" \
            -F "verified=true"
