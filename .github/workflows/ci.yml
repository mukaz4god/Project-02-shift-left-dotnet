name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  sast-scan:
    uses: ./.github/workflows/sast.yml

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml

  codeQL-scan-analysis:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      security-events: write
      contents: read

  dependency-check:
    uses: ./.github/workflows/dependency-check.yml

  image-scan:
    uses: ./.github/workflows/image-scan.yml
    permissions:
      contents: read
      security-events: write

  sbom:
    uses: ./.github/workflows/sbom.yml
